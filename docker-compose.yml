# Campaign Engine with PostgreSQL.
#   docker compose up --build
#   open http://localhost:8080/docs
# The API keys below are for local use only; set real ones through environment variables or secrets.
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      Database__Provider: PostgreSql
      Database__ConnectionString: "Host=db;Database=campaigns;Username=campaigns;Password=campaigns"
      Seed__Organizations__0__Slug: local-retail
      Seed__Organizations__0__Name: Local Retail
      Seed__Organizations__0__ApiKeys__0__Name: back-office
      Seed__Organizations__0__ApiKeys__0__Key: local-admin-key
      Seed__Organizations__0__ApiKeys__0__Scopes__0: admin
      Seed__Organizations__0__ApiKeys__1__Name: pos
      Seed__Organizations__0__ApiKeys__1__Key: local-pos-key
      Seed__Organizations__0__ApiKeys__1__Scopes__0: channel
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: campaigns
      POSTGRES_USER: campaigns
      POSTGRES_PASSWORD: campaigns
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaigns -d campaigns"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
